plugins {
  id 'com.enonic.xp.app'
  id 'com.github.node-gradle.node' version '7.1.0'
  id 'no.item.xp.codegen' version '3.0.0-SNAPSHOT'
}

dependencies {

  // ─────────────────────────────────────────────────────────────────────────
  // Libraries bundled with Enonic XP (versioned by xpVersion via the xplibs catalog)
  // ─────────────────────────────────────────────────────────────────────────
  include xplibs.admin
  // include xplibs.app
  // include xplibs.auditlog
  // include xplibs.auth
  // include xplibs.cluster
  // include xplibs.common
  // include xplibs.content
  // include xplibs.context
  // include xplibs.event
  // include xplibs.export
  // include xplibs.grid
  // include xplibs.i18n
  // include xplibs.io
  // include xplibs.mail
  // include xplibs.node
  include xplibs.portal
  // include xplibs.project
  // include xplibs.repo
  // include xplibs.scheduler
  // include xplibs.schema
  // include xplibs.sse
  // include xplibs.task
  // include xplibs.value
  // include xplibs.vhost
  // include xplibs.websocket

  // ─────────────────────────────────────────────────────────────────────────
  // Libraries from the Enonic Market (versions in gradle/libs.versions.toml)
  // ─────────────────────────────────────────────────────────────────────────

  // https://market.enonic.com/vendors/enonic/lib-asset
  // include libs.asset

  // https://market.enonic.com/vendors/enonic/cache-lib
  // include libs.cache

  // https://market.enonic.com/vendors/enonic/http-client-lib
  // include libs.http.client

  // https://market.enonic.com/vendors/enonic/mustache-lib
  // include libs.mustache

  // https://market.enonic.com/vendors/enonic/router-lib
  // include libs.router

  // https://market.enonic.com/vendors/enonic/lib-static
  // include libs.static

  // https://market.enonic.com/vendors/enonic/thymeleaf-lib
  // include libs.thymeleaf

  // ─────────────────────────────────────────────────────────────────────────
  // Item libraries (https://repo.itemtest.no/#/releases)
  // ─────────────────────────────────────────────────────────────────────────
  include libs.item.freemarker
  include libs.item.time
  // include libs.item.turbo

  // ─────────────────────────────────────────────────────────────────────────
  // Webjars (https://www.webjars.org/)
  // ─────────────────────────────────────────────────────────────────────────
  webjar libs.webjar.popover.polyfill
  webjar libs.webjar.turbo
}

repositories {
  mavenLocal()
  mavenCentral()
  xp.enonicRepo()
  maven { url = "https://repo.itemtest.no/releases" }
  maven { url = "https://repo.itemtest.no/snapshots" }
}

node {
  // Whether to download and install a specific Node.js version or not
  // If false, it will use the globally installed Node.js
  // If true, it will download node using above parameters
  // Note that npm is bundled with Node.js
  download = true

  // Version of node to download and install (only used if download is true)
  // It will be unpacked in the workDir
  version = '24.20.0'
}

processResources {
	exclude '**/.gitkeep'
  exclude '**/*.json'
	exclude '**/*.ts'
	exclude '**/*.tsx'
}

tasks.register('npmBuild', NpmTask) {
  args = [
    'run',
    '--silent',
    'build'
  ]
  dependsOn npmInstall
  dependsOn generateTypeScript
  environment = [
    'FORCE_COLOR': 'true',
    'LOG_LEVEL_FROM_GRADLE': gradle.startParameter.logLevel.toString(),
    'NODE_ENV': project.findProperty('env') == 'dev' ? 'development' : 'production'
  ]
  inputs.dir 'src/main/resources'
  outputs.dir 'build/resources/main'
  outputs.upToDateWhen { false }
}

jar.dependsOn npmBuild

tasks.register('npmCheck', NpmTask) {
	dependsOn npmInstall
	dependsOn generateTypeScript
	args = [
		'run',
		'check'
	]
	environment = [
		'FORCE_COLOR': 'true',
	]
}

check.dependsOn npmCheck

tasks.register('npmTest', NpmTask) {
	args = [
		'run',
		'test'
	]
	dependsOn npmInstall
	environment = [
		'FORCE_COLOR': 'true',
	]
  inputs.dir 'src/jest'
  outputs.dir 'coverage'
  outputs.upToDateWhen { false }
}

test.dependsOn npmTest

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}
